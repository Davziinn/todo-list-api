version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: TODO-LIST-DB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: TODO-LIST-DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
